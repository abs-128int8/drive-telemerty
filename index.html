<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <title>Drive Telemetry</title>
  <script src="app.js" defer></script>
</head>

<body>
  <header>
    <h1>Drive Telemetry</h1>
  </header>

  <main>
    <div id="g-meter">
      <svg viewBox="-255 -105 510 210">
        <rect x="-100" y="-40" width="200" height="80" fill="transparent" stroke="lightblue" stroke-width="4" rx="20" />
        <rect x="-150" y="-60" width="300" height="120" fill="transparent" stroke="lightblue" stroke-width="4"
          rx="20" />
        <rect x="-200" y="-80" width="400" height="160" fill="transparent" stroke="lightblue" stroke-width="4"
          rx="20" />
        <rect x="-250" y="-100" width="500" height="200" fill="transparent" stroke="white" stroke-width="4" rx="20" />
        <text x="0" y="0" font-size="40" fill="white" text-anchor="middle" dominant-baseline="middle"
          id="acceleration-text">0.00 G</text>
      </svg>
    </div>
    <div id="speed-meter">
      <section id="speed">
        <span id="speed-value">0</span>
        <span>KM/H</span>
      </section>
      <section id="stop-time">
        <span>Stop</span>
        <span id="stop-time-value">0</span>
        <span>s</span>
      </section>
      <section id="status">
        <div id="distance">
          <span id="distance-value">0.00</span>
          <span>km</span>
        </div>
        <div id="time">00:00:00</div>
      </section>
    </div>
    <hr>
    <div id="sector-info">
      <div id="sector-header">
        <span>#</span>
        <span id="sector-number">0</span>
        <span>&nbsp;</span>
        <span id="sector-start">00:00:00</span>
      </div>
      <div id="sector-values">
        <section id="sector-distance">
          <span class="sector-label">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
          <span id="sector-distance-value" class="sector-value">0.00</span>
          <span class="sector-unit">km</span>
        </section>
        <section id="sector-time">
          <span id="sector-time-value" class="sector-value">00:00:00</span>
        </section>
        <section id="sector-max-velocity">
          <span class="sector-label">max</span>
          <span id="sector-max-velocity-value" class="sector-value">0.00</span>
          <span class="sector-unit">km/h</span>
        </section>
        <section id="sector-avg-velocity">
          <span class="sector-label">avg</span>
          <span id="sector-avg-velocity-value" class="sector-value">0.00</span>
          <span class="sector-unit">km/h</span>
        </section>
        <section id="sector-max-acceleration">
          <span class="sector-label">max</span>
          <span id="sector-max-acceleration-value" class="sector-value">0.00</span>
          <span class="sector-unit">G</span>
        </section>
        <section id="sector-0-20">
          <span class="sector-label">020</span>
          <span id="sector-0-20-value" class="sector-value">0.00</span>
          <span class="sector-unit">s</span>
        </section>
      </div>
    </div>
    <hr>
    <div id="history">
    </div>
  </main>

  <footer class="flex-center">
    Ⓒ 2026 abs-128int8
  </footer>
</body>

</html>
